services:
  loa:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loa-sandbox
    ports:
      - "8104:8104"
    environment:
      - USER_ID=${USER_ID:-1000}
      - GROUP_ID=${GROUP_ID:-1000}
    volumes:
      # Mount the target project dynamically
      - ${TARGET_PROJECT:-./workspace}:/workspace
      # Mount the global config dynamically
      - ${CONFIG_MOUNT:-./config:/home/loa/.config/loa:ro}
      # Mount the entire .loa directory (models, binaries) at exact host path
      - ${LOA_DIR_MOUNT:-./loa_env:/home/loa/.loa:ro}
    # Allow communication to the host on Linux via host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Ensure standard input/output is attached
    stdin_open: true
    tty: true
